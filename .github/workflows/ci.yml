name: CI

# Збірка й тести на кожен PR і на кожен пуш у main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Новий пуш у ту саму гілку скасовує попередній ще не завершений прогін.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLUTION: SmartArchiver.slnx
  # Нижня межа покриття рядків у відсотках. 0 = лише звіт без перевірки; після першого прогону підніміть
  # до поточного значення, щоб покриття не падало непомітно.
  COVERAGE_MIN_LINE: 0
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: bash   # однаковий синтаксис на Linux і Windows

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Тестам БД потрібен SQL Server. Контейнер є лише на Linux: Windows-раннери GitHub не запускають
      # Linux-контейнери, тож там ці тести пропускаються (див. DatabaseFactAttribute).
      # Стартуємо до збірки, щоб сервер піднімався паралельно. Пароль новий на кожен прогін і замаскований у логах.
      - name: Start SQL Server (Linux)
        if: runner.os == 'Linux'
        run: |
          password="Ci_$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name sql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" \
            mcr.microsoft.com/mssql/server:2025-latest

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # -warnaserror: в CI будь-яке попередження лінтера або компілятора ламає збірку.
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore -warnaserror

      # Чекаємо, поки сервер прийме вхід, і лише тоді вмикаємо тести БД.
      - name: Wait for SQL Server (Linux)
        if: runner.os == 'Linux'
        run: |
          for attempt in $(seq 1 60); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SMARTARCHIVER_TEST_SQLSERVER=Server=localhost,1433;User Id=sa;Password=$SQL_SA_PASSWORD;TrustServerCertificate=true" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs sql
          exit 1

      # LogFilePrefix, а не LogFileName: тестових проєктів кілька, і з однаковою назвою звіти затирали б один одного.
      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release --no-build
          --logger "trx;LogFilePrefix=test-results"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # Звіт покриття: cobertura з усіх тестових проєктів зводиться в один звіт. Один раз на прогін (Linux),
      # бо Windows-задача дала б ті самі числа. Без тестів, застосунку Avalonia і міграцій EF Core.
      - name: Coverage report
        if: runner.os == 'Linux' && !cancelled() && hashFiles('TestResults/**/coverage.cobertura.xml') != ''
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:CoverageReport" \
            "-reporttypes:MarkdownSummaryGithub;Html;TextSummary" \
            "-assemblyfilters:+SmartArchiver.*;-SmartArchiver.*.Tests;-SmartArchiver.App" \
            "-classfilters:-SmartArchiver.Data.Migrations.*"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          cat CoverageReport/Summary.txt
          line=$(grep -m1 "Line coverage" CoverageReport/Summary.txt | sed -E 's/[^0-9.]*([0-9.]+)%.*/\1/')
          echo "Покриття рядків: ${line}% (межа ${COVERAGE_MIN_LINE}%)"
          awk -v actual="$line" -v min="$COVERAGE_MIN_LINE" 'BEGIN { exit !(actual + 0 >= min + 0) }'

      - name: Upload coverage report
        if: runner.os == 'Linux' && !cancelled() && hashFiles('CoverageReport/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport/**
          retention-days: 14

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14
